workflows:
  diagnose_aridmans_project:
    name: Diagnose Aridman's Happy Place

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. FIND AND EXTRACT THE MAIN ZIP
      # =========================================================
      - name: Extract project ZIP
        script: |
          set -e

          echo "========================================"
          echo "📦 FINDING PROJECT ZIP"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found."

            echo ""
            echo "ZIP files found:"
            find "$CM_BUILD_DIR" \
              -type f \
              -iname "*.zip" \
              -print

            exit 1
          fi

          echo "✅ ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted_project"

          # Remove macOS ZIP metadata
          rm -rf "$CM_BUILD_DIR/extracted_project/__MACOSX"

          # Remove Finder metadata
          find "$CM_BUILD_DIR/extracted_project" \
            -name ".DS_Store" \
            -delete

          echo ""
          echo "========================================"
          echo "📂 EXTRACTED CONTENTS"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted_project" \
            -maxdepth 6 \
            -print

      # =========================================================
      # 2. FIND REAL XCODE PROJECT
      # =========================================================
      - name: Find Xcode project
        script: |
          set -e

          echo "========================================"
          echo "🔎 FINDING XCODE PROJECT"
          echo "========================================"

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "AridmansHappyPlace.xcodeproj" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ AridmansHappyPlace.xcodeproj not found."

            echo ""
            echo "Available Xcode projects:"
            find "$CM_BUILD_DIR/extracted_project" \
              -type d \
              -name "*.xcodeproj" \
              -print

            exit 1
          fi

          echo "✅ PROJECT:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" \
            > "$CM_BUILD_DIR/project.env"

      # =========================================================
      # 3. VERIFY PROJECT FILE
      # =========================================================
      - name: Verify project file
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "📄 VERIFYING PROJECT"
          echo "========================================"

          if [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "❌ project.pbxproj not found."
            exit 1
          fi

          echo "✅ project.pbxproj exists"

          echo ""
          echo "Project size:"
          wc -c "$PROJECT/project.pbxproj"

      # =========================================================
      # 4. XCODE LIST
      # =========================================================
      - name: List Xcode targets and schemes
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo ""
          echo "========================================"
          echo "📋 XCODE TARGETS AND SCHEMES"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -list

      # =========================================================
      # 5. NATIVE TARGET INFORMATION
      # =========================================================
      - name: Inspect native targets
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo ""
          echo "========================================"
          echo "🎯 NATIVE TARGETS"
          echo "========================================"

          grep -n \
            -B 8 \
            -A 35 \
            "PBXNativeTarget" \
            "$PBX" \
            || true

      # =========================================================
      # 6. PRODUCT TYPES
      # =========================================================
      - name: Inspect product types
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo ""
          echo "========================================"
          echo "📱 PRODUCT TYPES"
          echo "========================================"

          grep -n \
            "productType" \
            "$PBX" \
            || true

      # =========================================================
      # 7. PLATFORM SETTINGS
      # =========================================================
      - name: Inspect platform settings
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo ""
          echo "========================================"
          echo "⚙️ PLATFORM SETTINGS"
          echo "========================================"

          grep -nE \
            "SDKROOT|SUPPORTED_PLATFORMS|TARGETED_DEVICE_FAMILY|SUPPORTS_MACCATALYST|IPHONEOS_DEPLOYMENT_TARGET|MACOSX_DEPLOYMENT_TARGET" \
            "$PBX" \
            || true

      # =========================================================
      # 8. PRODUCT / BUNDLE SETTINGS
      # =========================================================
      - name: Inspect product settings
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo ""
          echo "========================================"
          echo "📦 PRODUCT SETTINGS"
          echo "========================================"

          grep -nE \
            "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|INFOPLIST_FILE|GENERATE_INFOPLIST_FILE" \
            "$PBX" \
            || true

      # =========================================================
      # 9. IOS REFERENCES
      # =========================================================
      - name: Inspect iOS references
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo ""
          echo "========================================"
          echo "🍎 IOS REFERENCES"
          echo "========================================"

          grep -nEi \
            "iphoneos|iphonesimulator|IPHONEOS|ios" \
            "$PBX" \
            || true

      # =========================================================
      # 10. MACOS REFERENCES
      # =========================================================
      - name: Inspect macOS references
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo ""
          echo "========================================"
          echo "🖥️ MACOS REFERENCES"
          echo "========================================"

          grep -nEi \
            "macos|MACOSX|macosx" \
            "$PBX" \
            || true

      # =========================================================
      # 11. FIND SCHEMES
      # =========================================================
      - name: Find schemes
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")

          echo ""
          echo "========================================"
          echo "📑 SCHEMES"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.xcscheme" \
            -print

      # =========================================================
      # 12. PRINT SCHEME CONTENT
      # =========================================================
      - name: Inspect schemes
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")

          echo ""
          echo "========================================"
          echo "📜 SCHEME CONTENT"
          echo "========================================"

          SCHEMES=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.xcscheme" \
            -print)

          if [ -z "$SCHEMES" ]; then
            echo "❌ No schemes found."
            exit 1
          fi

          while IFS= read -r SCHEME; do

            echo ""
            echo "----------------------------------------"
            echo "SCHEME:"
            echo "$SCHEME"
            echo "----------------------------------------"

            cat "$SCHEME"

          done <<< "$SCHEMES"

      # =========================================================
      # 13. FIND SWIFT SOURCES
      # =========================================================
      - name: Find Swift source files
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")

          echo ""
          echo "========================================"
          echo "🧩 SWIFT SOURCE FILES"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.swift" \
            -not -path "*/__MACOSX/*" \
            -print

      # =========================================================
      # 14. SHOW BUILD SETTINGS
      # =========================================================
      - name: Show build settings
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo ""
          echo "========================================"
          echo "⚙️ XCODE BUILD SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "AridmansHappyPlace" \
            -showBuildSettings \
            2>&1 || true

      # =========================================================
      # 15. DIAGNOSTIC COMPLETE
      # =========================================================
      - name: Diagnostic complete
        script: |
          echo ""
          echo "========================================"
          echo "✅ DIAGNOSTIC COMPLETE"
          echo "========================================"
          echo ""
          echo "The project was extracted and inspected."
          echo ""
          echo "NO IPA BUILD WAS ATTEMPTED."
          echo ""
          echo "Look above for:"
          echo "• Xcode targets"
          echo "• schemes"
          echo "• product types"
          echo "• SDK settings"
          echo "• iOS references"
          echo "• macOS references"
          echo "• Swift files"
          echo "• build settings"

    artifacts:
      - extracted_project/**/*.xcodeproj/project.pbxproj
