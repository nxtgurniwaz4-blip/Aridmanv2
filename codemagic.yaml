workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:

      - name: Extract main ZIP
        script: |
          set -e

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found"
            exit 1
          fi

          echo "📦 ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted_project"

          echo ""
          echo "📂 Extracted files:"
          find "$CM_BUILD_DIR/extracted_project" -maxdepth 5 -print

      - name: Find Xcode project
        script: |
          set -e

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "❌ No .xcodeproj found!"
            echo ""
            echo "Xcode projects found:"
            find "$CM_BUILD_DIR/extracted_project" -name "*.xcodeproj" -print
            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJECT" .xcodeproj)
          PROJECT_DIR=$(dirname "$PROJECT")

          echo "✅ Xcode project:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" > "$CM_BUILD_DIR/project.env"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$CM_BUILD_DIR/project.env"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_BUILD_DIR/project.env"

      - name: Verify Xcode project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "🔍 Checking:"
          echo "$PROJECT"

          test -f "$PROJECT/project.pbxproj"

          echo "✅ project.pbxproj found"

          SCHEME=$(find "$PROJECT_DIR" \
            -path "*/xcshareddata/xcschemes/*.xcscheme" \
            -print -quit)

          if [ -z "$SCHEME" ]; then
            echo "❌ No shared Xcode scheme found"
            echo ""
            echo "Available schemes:"
            find "$PROJECT_DIR" -name "*.xcscheme" -print
            exit 1
          fi

          SCHEME_NAME=$(basename "$SCHEME" .xcscheme)

          echo "✅ Scheme found:"
          echo "$SCHEME_NAME"

          echo "SCHEME_NAME=$SCHEME_NAME" >> "$CM_BUILD_DIR/project.env"

          APP_SOURCE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*App.swift" \
            -print -quit)

          if [ -z "$APP_SOURCE" ]; then
            echo "⚠️ No *App.swift found."
            echo "Continuing because the Xcode project itself is valid."
          else
            echo "✅ App source:"
            echo "$APP_SOURCE"
          fi

      - name: Build unsigned archive
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

          echo "🏗️ Building:"
          echo "$PROJECT"
          echo "Scheme: $SCHEME_NAME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        script: |
          set -e

          ARCHIVE="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          APP_PATH=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in archive"
            find "$ARCHIVE" -maxdepth 5 -print
            exit 1
          fi

          echo "📱 App:"
          echo "$APP_PATH"

          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"

          zip -qr \
            "AridmansHappyPlace-unsigned.ipa" \
            Payload

          test -f "AridmansHappyPlace-unsigned.ipa"

          echo ""
          echo "🎉 UNSIGNED IPA CREATED"
          ls -lh "AridmansHappyPlace-unsigned.ipa"

    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive/**
