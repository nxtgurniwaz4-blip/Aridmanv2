workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned iOS IPA

    environment:
      xcode: latest
      groups:
        - youtube

    scripts:
      - name: Validate project
        script: |
          set -euo pipefail
          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"
          test -f "AridmansHappyPlace.xcodeproj/xcshareddata/xcschemes/AridmansHappyPlace.xcscheme"
          test -f "AridmansHappyPlaceApp.swift"
          test -f "CategoriesView.swift"
          test -f "CategoryTile.swift"
          test -f "VideoCatalog.swift"
          test -f "VideoListView.swift"
          test -f "Info.plist"
          test -d "Aridmanv2/Assets.xcassets"
          test -d "Aridmanv2/Assets.xcassets/AppIcon.appiconset"
          test -f "Aridmanv2/Assets.xcassets/AppIcon.appiconset/Contents.json"
          test -f "Aridmanv2/Assets.xcassets/AppIcon.appiconset/app icon.png"

          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path("AridmansHappyPlaceApp.swift"),
              Path("CategoriesView.swift"),
              Path("CategoryTile.swift"),
              Path("VideoCatalog.swift"),
              Path("VideoListView.swift"),
          ]:
              data = path.read_bytes()
              data.decode("utf-8")
              if any(b == 0 or (b < 32 and b not in (9, 10, 13)) for b in data):
                  raise SystemExit(f"ERROR: Invalid control/binary byte in {path}")
          print("Project validation passed.")
          PY

      - name: Show Xcode project
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "AridmansHappyPlace.xcodeproj" -list
          xcodebuild -project "AridmansHappyPlace.xcodeproj" -scheme "AridmansHappyPlace" -showBuildSettings

      - name: Build unsigned archive
        script: |
          set -euo pipefail
          BUILD_DIR="$CM_BUILD_DIR/build"
          ARCHIVE="$BUILD_DIR/AridmansHappyPlace.xcarchive"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          xcodebuild archive \
            -project "AridmansHappyPlace.xcodeproj" \
            -scheme "AridmansHappyPlace" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            YOUTUBE_API_KEY="$YOUTUBE_API_KEY"

          test -d "$ARCHIVE/Products/Applications/AridmansHappyPlace.app"
          echo "Unsigned archive created successfully."

      - name: Package and validate unsigned IPA
        script: |
          set -euo pipefail

          BUILD_DIR="$CM_BUILD_DIR/build"
          ARCHIVE="$BUILD_DIR/AridmansHappyPlace.xcarchive"
          APP="$ARCHIVE/Products/Applications/AridmansHappyPlace.app"
          IPA="$BUILD_DIR/AridmansHappyPlace-unsigned.ipa"

          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/AridmansHappyPlace"

          rm -rf "$BUILD_DIR/Payload"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP" "$BUILD_DIR/Payload/AridmansHappyPlace.app"

          /usr/bin/plutil -lint "$BUILD_DIR/Payload/AridmansHappyPlace.app/Info.plist"

          rm -f "$IPA"
          cd "$BUILD_DIR"
          /usr/bin/ditto -c -k --keepParent Payload "$IPA"

          test -f "$IPA"
          /usr/bin/unzip -t "$IPA"

          echo "=== IPA structure ==="
          /usr/bin/unzip -l "$IPA"

          echo "=== Required paths ==="
          /usr/bin/unzip -l "$IPA" | grep -F "Payload/AridmansHappyPlace.app/Info.plist"
          /usr/bin/unzip -l "$IPA" | grep -F "Payload/AridmansHappyPlace.app/AridmansHappyPlace"

          echo "IPA packaging validation passed."
          echo "NOTE: This IPA is intentionally unsigned and must be signed with your certificate/profile before iOS installation."

    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive
