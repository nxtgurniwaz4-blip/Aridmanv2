workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

      vars:
        XCODE_PROJECT: "AridmansHappyPlace.xcodeproj"
        SCHEME: "AridmansHappyPlace"

    scripts:

      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen version

      - name: Extract app ZIP
        script: |
          set -e

          ZIP_FILE="AridmansHappyPlace-GitHub-ready 2.zip"

          echo "Current repository:"
          pwd
          ls -la

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "Extracted files:"
          find "$CM_BUILD_DIR/extracted" -maxdepth 4 -print

          # Copy extracted contents into the build directory.
          cp -R "$CM_BUILD_DIR/extracted/"* "$CM_BUILD_DIR/" || true

          echo "Build directory after extraction:"
          find "$CM_BUILD_DIR" -maxdepth 3 -print

      - name: Verify project files
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Looking for project.yml..."
          find . -name "project.yml" -print

          echo "Looking for AridmansHappyPlace source directory..."
          find . -type d -name "AridmansHappyPlace" -print

          if [ ! -f "project.yml" ]; then
            echo "ERROR: project.yml was not found at build root."
            exit 1
          fi

          if [ ! -d "AridmansHappyPlace" ]; then
            echo "ERROR: AridmansHappyPlace source directory was not found."
            echo "Actual directories:"
            find . -type d -maxdepth 4 -print
            exit 1
          fi

      - name: Generate Xcode project
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf AridmansHappyPlace.xcodeproj

          xcodegen generate --spec project.yml

          if [ ! -d "AridmansHappyPlace.xcodeproj" ]; then
            echo "ERROR: Xcode project was not generated."
            exit 1
          fi

      - name: Build unsigned archive
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        script: |
          set -e

          ARCHIVE_PATH="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"
          APPLICATIONS_PATH="$ARCHIVE_PATH/Products/Applications"

          echo "Applications in archive:"
          find "$APPLICATIONS_PATH" -maxdepth 2 -print

          APP_PATH="$APPLICATIONS_PATH/Aridman's Happy Place.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built app not found."
            find "$APPLICATIONS_PATH" -maxdepth 2 -print
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/unsigned_ipa"

          mkdir -p "$CM_BUILD_DIR/unsigned_ipa/Payload"

          cp -R "$APP_PATH" \
            "$CM_BUILD_DIR/unsigned_ipa/Payload/"

          cd "$CM_BUILD_DIR/unsigned_ipa"

          /usr/bin/zip \
            -qry \
            "$CM_BUILD_DIR/AridmansHappyPlace-unsigned.ipa" \
            Payload

          echo "Unsigned IPA created:"
          ls -lh "$CM_BUILD_DIR/AridmansHappyPlace-unsigned.ipa"

    artifacts:
      - AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive
      - AridmansHappyPlace.xcodeproj/project.pbxproj
