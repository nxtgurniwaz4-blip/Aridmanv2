workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:

      # ---------------------------------------------------------
      # 1. Find and extract the main ZIP
      # ---------------------------------------------------------
      - name: Extract main ZIP
        script: |
          set -e

          echo "========================================"
          echo "📦 FINDING PROJECT ZIP"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found in repository."
            echo ""
            echo "ZIP files found:"
            find "$CM_BUILD_DIR" -type f -iname "*.zip" -print
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted_project"

          # Remove macOS metadata
          rm -rf "$CM_BUILD_DIR/extracted_project/__MACOSX"

          # Remove Finder metadata
          find "$CM_BUILD_DIR/extracted_project" \
            -name ".DS_Store" \
            -delete

          echo ""
          echo "========================================"
          echo "📂 EXTRACTED PROJECT"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted_project" \
            -maxdepth 6 \
            -print

      # ---------------------------------------------------------
      # 2. Find the REAL Xcode project
      # ---------------------------------------------------------
      - name: Find Xcode project
        script: |
          set -e

          echo "========================================"
          echo "🔎 FINDING XCODE PROJECT"
          echo "========================================"

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ No Xcode project found."

            echo ""
            echo "Available Xcode projects:"
            find "$CM_BUILD_DIR/extracted_project" \
              -type d \
              -name "*.xcodeproj" \
              -print

            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJECT" .xcodeproj)
          PROJECT_DIR=$(dirname "$PROJECT")

          echo "✅ REAL Xcode project:"
          echo "$PROJECT"

          echo ""
          echo "Project name:"
          echo "$PROJECT_NAME"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT=$PROJECT" > "$CM_BUILD_DIR/project.env"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$CM_BUILD_DIR/project.env"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_BUILD_DIR/project.env"

      # ---------------------------------------------------------
      # 3. Verify project and find scheme
      # ---------------------------------------------------------
      - name: Verify Xcode project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "🔍 VERIFYING PROJECT"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT"

          # Xcode project file
          if [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "❌ project.pbxproj is missing"
            echo ""
            echo "Project contents:"
            find "$PROJECT" -maxdepth 4 -print
            exit 1
          fi

          echo "✅ project.pbxproj found"

          # Find shared schemes
          SCHEME=$(find "$PROJECT" \
            -type f \
            -name "*.xcscheme" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$SCHEME" ]; then
            echo "❌ No .xcscheme found."

            echo ""
            echo "Available schemes:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.xcscheme" \
              -print

            exit 1
          fi

          SCHEME_NAME=$(basename "$SCHEME" .xcscheme)

          echo "✅ Scheme found:"
          echo "$SCHEME_NAME"

          echo "SCHEME=$SCHEME" >> "$CM_BUILD_DIR/project.env"
          echo "SCHEME_NAME=$SCHEME_NAME" >> "$CM_BUILD_DIR/project.env"

          # Look for Swift app entry point.
          APP_SOURCE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*App.swift" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -n "$APP_SOURCE" ]; then
            echo "✅ SwiftUI app source:"
            echo "$APP_SOURCE"
          else
            echo "⚠️ No *App.swift found."
            echo "Continuing because the Xcode project itself is valid."
          fi

          echo ""
          echo "========================================"
          echo "✅ PROJECT VERIFICATION COMPLETE"
          echo "========================================"

      # ---------------------------------------------------------
      # 4. Show Xcode build settings
      # ---------------------------------------------------------
      - name: Check Xcode scheme
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "🛠️ CHECKING XCODE SCHEME"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -showBuildSettings \
            | head -n 150

      # ---------------------------------------------------------
      # 5. Build unsigned archive
      # ---------------------------------------------------------
      - name: Build unsigned archive
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "🏗️ BUILDING UNSIGNED ARCHIVE"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

          echo ""
          echo "========================================"
          echo "✅ ARCHIVE BUILD COMPLETE"
          echo "========================================"

      # ---------------------------------------------------------
      # 6. Find .app inside archive
      # ---------------------------------------------------------
      - name: Locate built app
        script: |
          set -e

          ARCHIVE="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          echo "========================================"
          echo "📱 LOCATING BUILT APP"
          echo "========================================"

          APP_PATH=$(find \
            "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in archive."

            echo ""
            echo "Archive contents:"
            find "$ARCHIVE" -maxdepth 6 -print

            exit 1
          fi

          echo "✅ Built app:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" > "$CM_BUILD_DIR/app.env"

      # ---------------------------------------------------------
      # 7. Package unsigned IPA
      # ---------------------------------------------------------
      - name: Package unsigned IPA
        script: |
          set -e

          source "$CM_BUILD_DIR/app.env"

          echo "========================================"
          echo "📦 PACKAGING UNSIGNED IPA"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/build/Payload"

          mkdir -p "$CM_BUILD_DIR/build/Payload"

          cp -R "$APP_PATH" \
            "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"

          rm -f "AridmansHappyPlace-unsigned.ipa"

          zip -qr \
            "AridmansHappyPlace-unsigned.ipa" \
            Payload

          if [ ! -f "AridmansHappyPlace-unsigned.ipa" ]; then
            echo "❌ IPA creation failed"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "🎉 UNSIGNED IPA CREATED"
          echo "========================================"

          ls -lh \
            "AridmansHappyPlace-unsigned.ipa"

          echo ""
          echo "IPA:"
          echo "$CM_BUILD_DIR/build/AridmansHappyPlace-unsigned.ipa"

    # -----------------------------------------------------------
    # Artifacts
    # -----------------------------------------------------------
    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive/**
      
