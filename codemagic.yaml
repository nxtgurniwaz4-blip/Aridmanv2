workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. EXTRACT THE MAIN ZIP
      # =========================================================
      - name: Extract project ZIP
        script: |
          set -e

          echo "========================================"
          echo "📦 EXTRACTING PROJECT ZIP"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found."
            echo ""
            echo "Files in build directory:"
            find "$CM_BUILD_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted_project"

          # Remove macOS archive metadata
          rm -rf "$CM_BUILD_DIR/extracted_project/__MACOSX"

          find "$CM_BUILD_DIR/extracted_project" \
            -name ".DS_Store" \
            -delete

          echo ""
          echo "✅ Extraction complete."

      # =========================================================
      # 2. FIND THE REAL XCODE PROJECT
      # =========================================================
      - name: Find Xcode project
        script: |
          set -e

          echo "========================================"
          echo "🔎 FINDING XCODE PROJECT"
          echo "========================================"

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "AridmansHappyPlace.xcodeproj" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ AridmansHappyPlace.xcodeproj not found."

            echo ""
            echo "Available Xcode projects:"
            find "$CM_BUILD_DIR/extracted_project" \
              -type d \
              -name "*.xcodeproj" \
              -print

            exit 1
          fi

          echo "✅ Xcode project:"
          echo "$PROJECT"

          if [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "❌ project.pbxproj missing."
            exit 1
          fi

          echo "PROJECT=$PROJECT" \
            > "$CM_BUILD_DIR/project.env"

      # =========================================================
      # 3. REPAIR IOS PROJECT CONFIGURATION
      # =========================================================
      - name: Configure iOS target
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo "========================================"
          echo "🔧 CONFIGURING IOS TARGET"
          echo "========================================"

          cp "$PBX" "$PBX.original"

          python3 <<PY
          from pathlib import Path

          path = Path("$PBX")
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()
          output = []

          for line in lines:

              if "buildSettings = {" in line:

                  if "SDKROOT" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SDKROOT = iphoneos;"
                      )

                  if "SUPPORTED_PLATFORMS" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          'buildSettings = { SUPPORTED_PLATFORMS = "iphoneos iphonesimulator";'
                      )

                  if "SUPPORTS_MACCATALYST" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SUPPORTS_MACCATALYST = NO;"
                      )

              output.append(line)

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("✅ SDKROOT configured")
          print("✅ iOS platforms configured")
          print("✅ Mac Catalyst disabled")
          PY

          echo ""
          echo "Platform settings:"
          grep -nE \
            "SDKROOT|SUPPORTED_PLATFORMS|SUPPORTS_MACCATALYST|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY" \
            "$PBX" \
            || true

      # =========================================================
      # 4. FIND SCHEME
      # =========================================================
      - name: Find
