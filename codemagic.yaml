workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. EXTRACT ZIP
      # =========================================================
      - name: Extract project ZIP
        script: |
          set -e

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP found"
            exit 1
          fi

          echo "📦 Using ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted_project"

          rm -rf "$CM_BUILD_DIR/extracted_project/__MACOSX"

          find "$CM_BUILD_DIR/extracted_project" \
            -name ".DS_Store" \
            -delete

      # =========================================================
      # 2. FIND PROJECT
      # =========================================================
      - name: Find Xcode project
        script: |
          set -e

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "AridmansHappyPlace.xcodeproj" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ AridmansHappyPlace.xcodeproj not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" \
            > "$CM_BUILD_DIR/project.env"

          echo "✅ Project:"
          echo "$PROJECT"

      # =========================================================
      # 3. REPAIR IOS PLATFORM SETTINGS
      # =========================================================
      - name: Repair iOS project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo "========================================"
          echo "🔧 REPAIRING IOS PROJECT"
          echo "========================================"

          cp "$PBX" "$PBX.original"

          python3 <<PY
          from pathlib import Path

          path = Path("$PBX")
          text = path.read_text()

          lines = text.splitlines()
          output = []

          for line in lines:
              if "buildSettings = {" in line:

                  # Don't add duplicates
                  if "SDKROOT" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SDKROOT = iphoneos;"
                      )

                  if "SUPPORTED_PLATFORMS" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SUPPORTED_PLATFORMS = \\"iphoneos iphonesimulator\\";"
                      )

                  if "SUPPORTS_MACCATALYST" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SUPPORTS_MACCATALYST = NO;"
                      )

              output.append(line)

          text = "\\n".join(output) + "\\n"

          path.write_text(text)

          print("✅ SDKROOT = iphoneos")
          print("✅ SUPPORTED_PLATFORMS = iphoneos iphonesimulator")
          print("✅ SUPPORTS_MACCATALYST = NO")
          PY

          echo ""
          echo "Resulting platform settings:"

          grep -nE \
            "SDKROOT|SUPPORTED_PLATFORMS|SUPPORTS_MACCATALYST|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY" \
            "$PBX" \
            || true

      # =========================================================
      # 4. FIND SCHEME
      # =========================================================
      - name: Find scheme
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")

          SCHEME=$(find "$PROJECT_DIR" \
            -type f \
            -name "AridmansHappyPlace.xcscheme" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$SCHEME" ]; then
            echo "❌ Scheme not found"
            exit 1
          fi

          echo "SCHEME=$SCHEME" \
            >> "$CM_BUILD_DIR/project.env"

          echo "SCHEME_NAME=AridmansHappyPlace" \
            >> "$CM_BUILD_DIR/project.env"

          echo "✅ Scheme:"
          echo "$SCHEME"

      # =========================================================
      # 5. VERIFY IOS SETTINGS
      # =========================================================
      - name: Verify iOS configuration
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "📱 VERIFYING IOS CONFIGURATION"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -showBuildSettings \
            | grep -E \
              "SDKROOT|SUPPORTED_PLATFORMS|SUPPORTS_MACCATALYST|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY|PRODUCT_BUNDLE_IDENTIFIER"

          echo ""
          echo "✅ iOS configuration detected"

      # =========================================================
      # 6. BUILD UNSIGNED ARCHIVE
      # =========================================================
      - name: Build unsigned archive
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "🏗️ BUILDING UNSIGNED IOS ARCHIVE"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/build"

          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

          echo ""
          echo "✅ ARCHIVE SUCCESSFULLY BUILT"

      # =========================================================
      # 7. FIND APP
      # =========================================================
      - name: Locate built application
        script: |
          set -e

          ARCHIVE="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          APP_PATH=$(find \
            "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No application found"
            find "$ARCHIVE" -maxdepth 6 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" \
            > "$CM_BUILD_DIR/app.env"

          echo "✅ Application:"
          echo "$APP_PATH"

      # =========================================================
      # 8. PACKAGE IPA
      # =========================================================
      - name: Package unsigned IPA
        script: |
          set -e

          source "$CM_BUILD_DIR/app.env"

          echo "========================================"
          echo "📦 PACKAGING UNSIGNED IPA"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/build/Payload"

          mkdir -p "$CM_BUILD_DIR/build/Payload"

          cp -R "$APP_PATH" \
            "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"

          zip -qr \
            "AridmansHappyPlace-unsigned.ipa" \
            Payload

          test -f \
            "AridmansHappyPlace-unsigned.ipa"

          echo ""
          echo "========================================"
          echo "🎉 SUCCESS"
          echo "========================================"

          ls -lh \
            "AridmansHappyPlace-unsigned.ipa"

    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive/**
