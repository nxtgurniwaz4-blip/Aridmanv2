workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Aridman's Happy Place.xcodeproj"
        SCHEME: "AridmansHappyPlace"

    scripts:

      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          echo "XcodeGen version:"
          xcodegen version

      - name: Extract app ZIP
        script: |
          set -e

          ZIP_FILE="AridmansHappyPlace-GitHub-ready 2.zip"
          TEMP_DIR="$CM_BUILD_DIR/extracted"

          echo "Repository contents:"
          ls -la

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          echo "Extracting ZIP..."
          unzip -o "$ZIP_FILE" -d "$TEMP_DIR"

          echo "Searching for source directory..."

          SOURCE_DIR=$(find "$TEMP_DIR" \
            -type d \
            -name "AridmansHappyPlace" \
            ! -path "*/__MACOSX/*" \
            | head -n 1)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: AridmansHappyPlace source directory was not found."
            find "$TEMP_DIR" -maxdepth 6 -print
            exit 1
          fi

          echo "Found:"
          echo "$SOURCE_DIR"

          rm -rf "$CM_BUILD_DIR/AridmansHappyPlace"

          cp -R \
            "$SOURCE_DIR" \
            "$CM_BUILD_DIR/AridmansHappyPlace"

          echo "Final source directory:"
          find "$CM_BUILD_DIR/AridmansHappyPlace" -maxdepth 2 -print

      - name: Verify project files
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Build directory:"
          pwd

          echo "Checking project.yml..."

          if [ ! -f "project.yml" ]; then
            echo "ERROR: project.yml was not found."
            ls -la
            exit 1
          fi

          echo "Checking source directory..."

          if [ ! -d "AridmansHappyPlace" ]; then
            echo "ERROR: AridmansHappyPlace source directory was not found."

            echo "Directories:"
            find "$CM_BUILD_DIR" \
              -maxdepth 5 \
              -type d \
              -print

            exit 1
          fi

          echo "Project files verified successfully."

      - name: Generate Xcode project
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf "Aridman's Happy Place.xcodeproj"

          echo "Running XcodeGen..."

          xcodegen generate --spec project.yml

          echo "Checking generated project..."

          if [ ! -d "Aridman's Happy Place.xcodeproj" ]; then
            echo "ERROR: Xcode project was not generated."
            ls -la
            exit 1
          fi

          echo "SUCCESS:"
          ls -ld "Aridman's Happy Place.xcodeproj"

      - name: Verify scheme
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Available schemes:"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -list

      - name: Build unsigned archive
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf build
          mkdir -p build

          echo "Building unsigned archive..."

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Find built app
        script: |
          set -e

          ARCHIVE_PATH="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          APPLICATIONS_PATH="$ARCHIVE_PATH/Products/Applications"

          echo "Searching archive for .app..."

          find "$APPLICATIONS_PATH" \
            -maxdepth 2 \
            -print

          APP_PATH=$(find \
            "$APPLICATIONS_PATH" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive."
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          printf '%s\n' "$APP_PATH" > "$CM_BUILD_DIR/app_path.txt"

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH=$(cat "$CM_BUILD_DIR/app_path.txt")

          echo "Packaging application:"
          echo "$APP_PATH"

          rm -rf "$CM_BUILD_DIR/unsigned_ipa"

          mkdir -p \
            "$CM_BUILD_DIR/unsigned_ipa/Payload"

          cp -R \
            "$APP_PATH" \
            "$CM_BUILD_DIR/unsigned_ipa/Payload/"

          cd "$CM_BUILD_DIR/unsigned_ipa"

          echo "Creating IPA..."

          /usr/bin/zip \
            -qry \
            "$CM_BUILD_DIR/AridmansHappyPlace-unsigned.ipa" \
            Payload

          echo "================================"
          echo "UNSIGNED IPA CREATED"
          echo "================================"

          ls -lh \
            "$CM_BUILD_DIR/AridmansHappyPlace-unsigned.ipa"

    artifacts:
      - "AridmansHappyPlace-unsigned.ipa"
      - "build/AridmansHappyPlace.xcarchive"
      - "Aridman's Happy Place.xcodeproj/project.pbxproj"
