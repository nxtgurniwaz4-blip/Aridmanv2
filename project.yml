name: "Aridaman's Happy Place"
options:
  bundleIdPrefix: com.aridaman
targets:
  AridmansHappyPlace:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [AridmansHappyPlace]
    settings:
      PRODUCT_NAME: "AridmansHappyPlace"
      # Forces the compiler to bypass type optimization paths that cause crashes
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: "singlefile"
      GCC_OPTIMIZATION_LEVEL: "0"
