name: AridmansHappyPlace

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  AridmansHappyPlace:
    type: application
    platform: iOS

    sources:
      - path: AridmansHappyPlace

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aridman.happyplace
        PRODUCT_NAME: "Aridman's Happy Place"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

    info:
      path: AridmansHappyPlace/Info.plist
      properties:
        CFBundleDisplayName: "Aridman's Happy Place"
        CFBundleName: "AridmansHappyPlace"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
