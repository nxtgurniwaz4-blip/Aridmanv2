
workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - Unsigned IPA

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. Extract the ZIP
      # =========================================================
      - name: Extract project
        script: |
          set -e

          ZIP_FILE="Aridmans-Happy-Place-Everything 5.zip"

          echo "Checking ZIP..."
          test -f "$ZIP_FILE"

          rm -rf extracted
          rm -rf AridmansHappyPlace
          rm -rf AridmansHappyPlace.xcodeproj

          mkdir -p extracted
          mkdir -p AridmansHappyPlace

          echo "Extracting..."
          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for project source..."

          APP_FILE=$(find extracted \
            -type f \
            -name "AridmansHappyPlaceApp.swift" \
            -print \
            -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: AridmansHappyPlaceApp.swift not found."
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          SOURCE_DIR=$(dirname "$APP_FILE")

          echo "Source directory:"
          echo "$SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. AridmansHappyPlace/

          echo ""
          echo "Project files:"
          find AridmansHappyPlace -maxdepth 3 -type f -print

          test -f "AridmansHappyPlace/AridmansHappyPlaceApp.swift"
          test -f "AridmansHappyPlace/Videocatalog.swift"

          echo "Extraction successful."


      # =========================================================
      # 2. Repair corrupted Videocatalog.swift
      # =========================================================
      - name: Repair Videocatalog.swift
        script: |
          set -e

          FILE="AridmansHappyPlace/Videocatalog.swift"

          echo ""
          echo "=========================================="
          echo "Repairing Videocatalog.swift"
          echo "=========================================="

          test -f "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("AridmansHappyPlace/Videocatalog.swift")
          data = p.read_bytes()

          print("Original size:", len(data), "bytes")
          print("Original lines:", len(data.splitlines()))

          # The inspection showed binary garbage appended after
          # the legitimate final closing brace.
          #
          # Find the final '}' and keep everything through it.
          last_brace = data.rfind(b'}')

          if last_brace == -1:
              raise SystemExit("ERROR: No closing brace found.")

          repaired = data[:last_brace + 1] + b'\n'

          removed = len(data) - len(repaired)

          p.write_bytes(repaired)

          print("Repaired size:", len(repaired), "bytes")
          print("Removed:", removed, "bytes")

          if removed <= 0:
              raise SystemExit(
                  "ERROR: No trailing data was removed. "
                  "Expected corrupted bytes after final brace."
              )

          print("Videocatalog.swift repaired.")
          PY

          echo ""
          echo "Last 10 lines:"
          tail -n 10 "$FILE"

          echo ""
          echo "Checking UTF-8 and binary content..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("AridmansHappyPlace/Videocatalog.swift")
          data = p.read_bytes()

          # UTF-8 validation
          try:
              data.decode("utf-8")
          except UnicodeDecodeError as e:
              print("ERROR: Invalid UTF-8:", e)
              raise SystemExit(1)

          # Check for control/binary bytes.
          bad = []

          for byte in data:
              if byte in (9, 10, 13):
                  continue

              if 32 <= byte <= 126:
                  continue

              bad.append(byte)

          if bad:
              print(
                  "ERROR: Non-printable/non-ASCII bytes remain:",
                  len(bad)
              )
              raise SystemExit(1)

          print("OK: Videocatalog.swift is clean.")
          PY


      # =========================================================
      # 3. Install XcodeGen
      # =========================================================
      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          echo "XcodeGen:"
          xcodegen --version


      # =========================================================
      # 4. Generate Xcode project
      # =========================================================
      - name: Generate Xcode project
        script: |
          set -e

          test -f "project.yml"
          test -d "AridmansHappyPlace"

          rm -rf "AridmansHappyPlace.xcodeproj"

          echo "Generating Xcode project..."

          xcodegen generate --spec project.yml

          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"

          echo "Xcode project generated successfully."


      # =========================================================
      # 5. Verify Xcode project
      # =========================================================
      - name: Verify Xcode project
        script: |
          set -e

          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"
          test -f "AridmansHappyPlace/AridmansHappyPlaceApp.swift"
          test -f "AridmansHappyPlace/Videocatalog.swift"

          echo ""
          echo "===== XCODE PROJECT ====="

          xcodebuild \
            -project "AridmansHappyPlace.xcodeproj" \
            -list

          echo ""
          echo "Project verification successful."


      # =========================================================
      # 6. Build unsigned archive
      # =========================================================
      - name: Build unsigned archive
        script: |
          set -e

          rm -rf "$CM_BUILD_DIR/build"

          mkdir -p "$CM_BUILD_DIR/build"

          echo ""
          echo "=========================================="
          echo "Building unsigned iOS archive"
          echo "=========================================="

          xcodebuild \
            -project "AridmansHappyPlace.xcodeproj" \
            -scheme "AridmansHappyPlace" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

          test -d "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          echo ""
          echo "Archive created successfully."


      # =========================================================
      # 7. Find application
      # =========================================================
      - name: Locate application
        script: |
          set -e

          ARCHIVE_PATH="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          echo "Searching archive..."

          APP_PATH=$(find \
            "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found."
            find "$ARCHIVE_PATH" -maxdepth 5 -print
            exit 1
          fi

          echo "APP:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/AridmansHappyPlace.app"

          test -d "$CM_BUILD_DIR/AridmansHappyPlace.app"


      # =========================================================
      # 8. Package unsigned IPA
      # =========================================================
      - name: Package unsigned IPA
        script: |
          set -e

          BUILD_DIR="$CM_BUILD_DIR/build"

          rm -rf "$BUILD_DIR/Payload"

          mkdir -p "$BUILD_DIR/Payload"

          cp -R \
            "$CM_BUILD_DIR/AridmansHappyPlace.app" \
            "$BUILD_DIR/Payload/"

          cd "$BUILD_DIR"

          rm -f "AridmansHappyPlace-unsigned.ipa"

          zip -qr \
            "AridmansHappyPlace-unsigned.ipa" \
            Payload

          test -f "AridmansHappyPlace-unsigned.ipa"

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh "AridmansHappyPlace-unsigned.ipa"


    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive

