workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:

      - name: Extract project ZIP
        script: |
          set -e

          echo "========================================"
          echo "EXTRACTING PROJECT ZIP"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted_project"

          rm -rf "$CM_BUILD_DIR/extracted_project/__MACOSX"

          find "$CM_BUILD_DIR/extracted_project" \
            -name ".DS_Store" \
            -delete

          echo "Extraction complete."


      - name: Find Xcode project
        script: |
          set -e

          echo "========================================"
          echo "FINDING XCODE PROJECT"
          echo "========================================"

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "AridmansHappyPlace.xcodeproj" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found."

            find "$CM_BUILD_DIR/extracted_project" \
              -type d \
              -name "*.xcodeproj" \
              -print

            exit 1
          fi

          echo "PROJECT=$PROJECT" \
            > "$CM_BUILD_DIR/project.env"

          echo "Found:"
          echo "$PROJECT"


      - name: Verify Xcode project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "VERIFYING XCODE PROJECT"
          echo "========================================"

          test -f "$PROJECT/project.pbxproj"

          PROJECT_DIR=$(dirname "$PROJECT")

          SWIFT_FILE="$PROJECT_DIR/AridmansHappyPlace/AridmansHappyPlaceApp.swift"

          if [ ! -f "$SWIFT_FILE" ]; then
            echo "WARNING: App Swift file not found at expected path."
          fi

          echo "Project structure OK."


      - name: Find build scheme
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")

          SCHEME=$(find "$PROJECT_DIR" \
            -type f \
            -name "AridmansHappyPlace.xcscheme" \
            -print \
            | head -n 1)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme not found."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.xcscheme" \
              -print

            exit 1
          fi

          echo "SCHEME_NAME=AridmansHappyPlace" \
            >> "$CM_BUILD_DIR/project.env"

          echo "SCHEME=$SCHEME"


      - name: Configure iOS project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo "========================================"
          echo "CONFIGURING IOS PROJECT"
          echo "========================================"

          cp "$PBX" "$PBX.backup"

          python3 - "$PBX" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()
          result = []

          for line in lines:

              if "buildSettings = {" in line:

                  if "SDKROOT" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SDKROOT = iphoneos;"
                      )

                  if "SUPPORTED_PLATFORMS" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          'buildSettings = { SUPPORTED_PLATFORMS = "iphoneos iphonesimulator";'
                      )

                  if "SUPPORTS_MACCATALYST" not in line:
                      line = line.replace(
                          "buildSettings = {",
                          "buildSettings = { SUPPORTS_MACCATALYST = NO;"
                      )

              result.append(line)

          path.write_text(
              "\n".join(result) + "\n",
              encoding="utf-8"
          )

          print("iOS settings configured.")
          PY


      - name: Repair Videocatalog Swift file
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")
          VIDEO="$PROJECT_DIR/AridmansHappyPlace/Videocatalog.swift"

          echo "========================================"
          echo "CHECKING VIDEOCATALOG"
          echo "========================================"

          if [ ! -f "$VIDEO" ]; then
            echo "Videocatalog.swift not found."
            exit 0
          fi

          python3 - "$VIDEO" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()

          bad = []

          for i, byte in enumerate(data):
              if byte == 0 or byte < 9 or 13 < byte < 32:
                  bad.append(i)

          if not bad:
              print("Videocatalog.swift contains no control bytes.")
              sys.exit(0)

          first = bad[0]

          print(
              "Binary/control data detected at byte:",
              first
          )

          newline = data.rfind(b"\n", 0, first)

          if newline == -1:
              raise SystemExit(
                  "Cannot safely repair Videocatalog.swift"
              )

          clean = data[:newline + 1]

          text = clean.decode("utf-8")

          backup = path.with_suffix(
              ".swift.corrupt-backup"
          )

          if not backup.exists():
              backup.write_bytes(data)

          # Count braces outside quoted strings.
          balance = 0
          in_string = False
          escaped = False

          for char in text:

              if escaped:
                  escaped = False
                  continue

              if char == "\\" and in_string:
                  escaped = True
                  continue

              if char == '"':
                  in_string = not in_string
                  continue

              if not in_string:

                  if char == "{":
                      balance += 1

                  elif char == "}":
                      balance -= 1

          text = text.rstrip() + "\n"

          if balance > 0:
              print(
                  "Adding missing closing braces:",
                  balance
              )

              text += "}" * balance
              text += "\n"

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Videocatalog.swift repaired.")
          PY


      - name: Verify Swift source
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "========================================"
          echo "VERIFYING SWIFT SOURCE"
          echo "========================================"

          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          for path in root.rglob("*.swift"):

              data = path.read_bytes()

              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as error:
                  print("ERROR:", path)
                  print(error)
                  raise SystemExit(1)

          print("All Swift files are valid UTF-8.")
          PY


      - name: Show build settings
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "IOS BUILD SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -showBuildSettings \
            | grep -E \
              "SDKROOT|SUPPORTED_PLATFORMS|SUPPORTS_MACCATALYST|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY|PRODUCT_BUNDLE_IDENTIFIER" \
            || true


      - name: Build unsigned archive
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "BUILDING UNSIGNED ARCHIVE"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/build"

          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

          echo "Archive completed."


      - name: Locate application
        script: |
          set -e

          ARCHIVE="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          echo "========================================"
          echo "LOCATING APP"
          echo "========================================"

          APP_PATH=$(find \
            "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Application not found."

            find "$ARCHIVE" \
              -maxdepth 7 \
              -print

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" \
            > "$CM_BUILD_DIR/app.env"

          echo "Application found."


      - name: Package unsigned IPA
        script: |
          set -e

          source "$CM_BUILD_DIR/app.env"

          echo "========================================"
          echo "PACKAGING IPA"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/build/Payload"

          mkdir -p "$CM_BUILD_DIR/build/Payload"

          cp -R \
            "$APP_PATH" \
            "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"

          zip -qr \
            "AridmansHappyPlace-unsigned.ipa" \
            Payload

          test -f \
            "AridmansHappyPlace-unsigned.ipa"

          echo ""
          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh \
            "AridmansHappyPlace-unsigned.ipa"


    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive/**
