workflows:
  ios_unsigned_ipa:
    name: Aridaman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Extract and prepare project
        script: |
          set -e

          ZIP_FILE="AridmansHappyPlace-GitHub-ready 3.zip"
          TEMP_DIR="$CM_BUILD_DIR/extracted"

          rm -rf "$TEMP_DIR"
          rm -rf "$CM_BUILD_DIR/AridmansHappyPlace"

          mkdir -p "$TEMP_DIR"
          mkdir -p "$CM_BUILD_DIR/AridmansHappyPlace"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            ls -lah
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d "$TEMP_DIR"

          echo "ZIP contents:"
          find "$TEMP_DIR" -maxdepth 5 -print

          echo "Copying Swift files..."

          find "$TEMP_DIR" \
            -type f \
            -name "*.swift" \
            ! -path "*/__MACOSX/*" \
            -exec cp {} "$CM_BUILD_DIR/AridmansHappyPlace/" \;

          INFO_PLIST=$(find "$TEMP_DIR" \
            -type f \
            -name "Info.plist" \
            ! -path "*/__MACOSX/*" \
            | head -n 1)

          if [ -n "$INFO_PLIST" ]; then
            cp "$INFO_PLIST" "$CM_BUILD_DIR/AridmansHappyPlace/Info.plist"
          fi

          echo "Final source directory:"
          find "$CM_BUILD_DIR/AridmansHappyPlace" -maxdepth 2 -type f -print

      - name: Verify source files
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          test -f project.yml
          test -d AridmansHappyPlace

          SWIFT_COUNT=$(find AridmansHappyPlace -type f -name "*.swift" | wc -l | tr -d ' ')

          echo "Swift files found: $SWIFT_COUNT"

          if [ "$SWIFT_COUNT" -eq 0 ]; then
            echo "ERROR: No Swift source files found."
            exit 1
          fi

          echo "Source verification successful."

      - name: Generate Xcode project
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf "Aridaman's Happy Place.xcodeproj"

          xcodegen generate --spec project.yml

          if [ ! -d "Aridaman's Happy Place.xcodeproj" ]; then
            echo "ERROR: Xcode project was not generated."
            exit 1
          fi

          echo "Generated:"
          ls -ld "Aridaman's Happy Place.xcodeproj"

      - name: Show Xcode project
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          xcodebuild \
            -project "Aridaman's Happy Place.xcodeproj" \
            -list

      - name: Build unsigned archive
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project "Aridaman's Happy Place.xcodeproj" \
            -scheme "AridmansHappyPlace" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

            - name: Verify built application
        script: |
          set -e

          APP_DIR="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive/Products/Applications"

          echo "Archive contents:"
          find "$APP_DIR" -maxdepth 2 -print

          APP_PATH=$(find "$APP_DIR" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found."
            exit 1
          fi

          echo "Application Path: $APP_PATH"
          du -sh "$APP_PATH"

          echo "EXECUTABLES:"
          find "$APP_PATH" \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -exec ls -lh {} \;

          # Updated to match the strict product output name generated by the compiler
          EXECUTABLE="${APP_PATH}/AridmansHappyPlace"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: Main executable not found."
            exit 1
          fi

          echo "MAIN EXECUTABLE SIZE:"
          du -sh "$EXECUTABLE"

