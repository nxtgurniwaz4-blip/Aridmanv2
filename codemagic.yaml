workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:
      - name: Extract project
        script: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 2 -print

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 3 -print

          SOURCE_DIR=$(find extracted -type f -name "AridmansHappyPlaceApp.swift" -print -quit | xargs -I{} dirname "{}")

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: AridmansHappyPlaceApp.swift was not found inside ZIP"
            exit 1
          fi

          echo "Swift source directory: $SOURCE_DIR"

          rm -rf AridmansHappyPlace
          mkdir -p AridmansHappyPlace

          cp -R "$SOURCE_DIR"/. AridmansHappyPlace/

          echo "Project files:"
          find AridmansHappyPlace -maxdepth 2 -type f -print

      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode project
        script: |
          set -e

          rm -rf AridmansHappyPlace.xcodeproj

          xcodegen generate --spec project.yml

          test -d AridmansHappyPlace.xcodeproj
          test -f AridmansHappyPlace.xcodeproj/project.pbxproj

          echo "Xcode project generated successfully"

      - name: Verify Xcode project
        script: |
          set -e

          test -d AridmansHappyPlace.xcodeproj
          test -f AridmansHappyPlace.xcodeproj/project.pbxproj
          test -f AridmansHappyPlace/AridmansHappyPlaceApp.swift

          xcodebuild \
            -project AridmansHappyPlace.xcodeproj \
            -list

      - name: Build unsigned archive
        script: |
          set -e

          mkdir -p build

          xcodebuild \
            -project AridmansHappyPlace.xcodeproj \
            -scheme AridmansHappyPlace \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create unsigned IPA
        script: |
          set -e

          APP_PATH=$(find \
            "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          test -n "$APP_PATH"

          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"

          zip -qr AridmansHappyPlace-unsigned.ipa Payload

          test -f AridmansHappyPlace-unsigned.ipa

          echo "UNSIGNED IPA CREATED"

    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive/**
