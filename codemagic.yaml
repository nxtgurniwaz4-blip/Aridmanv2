
workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest

    scripts:

      - name: Extract Aridmans Happy Place project
        script: |
          set -e

          ZIP_FILE="Aridmans-Happy-Place-Everything 5.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found"
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Found project ZIP:"
          ls -lh "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 4 -print

          APP_FILE=$(find extracted \
            -type f \
            -name "AridmansHappyPlaceApp.swift" \
            -print \
            -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: AridmansHappyPlaceApp.swift was not found inside the ZIP"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$APP_FILE")

          echo "Swift source directory:"
          echo "$SOURCE_DIR"

          rm -rf AridmansHappyPlace
          mkdir -p AridmansHappyPlace

          cp -R "$SOURCE_DIR"/. AridmansHappyPlace/

          echo "Final project source:"
          find AridmansHappyPlace -maxdepth 3 -type f -print

          test -f "AridmansHappyPlace/AridmansHappyPlaceApp.swift"

          echo "Project source extracted successfully"


      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version


      - name: Generate Xcode project
        script: |
          set -e

          rm -rf AridmansHappyPlace.xcodeproj

          xcodegen generate --spec project.yml

          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"

          echo "Xcode project generated successfully"


      - name: Verify Xcode project
        script: |
          set -e

          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"
          test -f "AridmansHappyPlace/AridmansHappyPlaceApp.swift"

          echo "Project structure OK"

          xcodebuild \
            -project "AridmansHappyPlace.xcodeproj" \
            -list


      - name: Build unsigned archive
        script: |
          set -e

          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild \
            -project "AridmansHappyPlace.xcodeproj" \
            -scheme "AridmansHappyPlace" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive


      - name: Package unsigned IPA
        script: |
          set -e

          ARCHIVE_PATH="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          APP_PATH=$(find \
            "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was found in the archive"
            exit 1
          fi

          echo "App found:"
          echo "$APP_PATH"

          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"

          cd "$CM_BUILD_DIR/build"

          rm -f "AridmansHappyPlace-unsigned.ipa"

          zip -qr \
            "AridmansHappyPlace-unsigned.ipa" \
            Payload

          test -f "AridmansHappyPlace-unsigned.ipa"

          echo "================================"
          echo "UNSIGNED IPA CREATED SUCCESSFULLY"
          echo "================================"


    artifacts:
      - build/AridmansHappyPlace-unsigned.ipa
      - build/AridmansHappyPlace.xcarchive/**
```
