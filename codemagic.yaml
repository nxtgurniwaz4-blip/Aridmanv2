workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - unsigned IPA

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AridmansHappyPlace.xcodeproj"
        SCHEME: "AridmansHappyPlace"

    scripts:

      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen version

      - name: Extract app ZIP
        script: |
          set -e

          ZIP_FILE="AridmansHappyPlace-GitHub-ready 2.zip"
          TEMP_DIR="$CM_BUILD_DIR/extracted"

          echo "Repository contents:"
          ls -la

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          echo "Extracting ZIP..."
          unzip -o "$ZIP_FILE" -d "$TEMP_DIR"

          echo "Extracted structure:"
          find "$TEMP_DIR" -maxdepth 5 -print

          SOURCE_DIR=$(find "$TEMP_DIR" \
            -type d \
            -name "AridmansHappyPlace" \
            ! -path "*/__MACOSX/*" \
            | head -n 1)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: AridmansHappyPlace source directory was not found."
            exit 1
          fi

          echo "Found source directory:"
          echo "$SOURCE_DIR"

          rm -rf "$CM_BUILD_DIR/AridmansHappyPlace"

          cp -R \
            "$SOURCE_DIR" \
            "$CM_BUILD_DIR/AridmansHappyPlace"

          echo "Final project structure:"
          find "$CM_BUILD_DIR/AridmansHappyPlace" -maxdepth 2 -print

      - name: Verify project files
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Current build directory:"
          pwd

          echo "Looking for project.yml..."
          ls -l project.yml

          echo "Looking for AridmansHappyPlace..."
          ls -ld AridmansHappyPlace

          if [ ! -f "project.yml" ]; then
            echo "ERROR: project.yml was not found."
            exit 1
          fi

          if [ ! -d "AridmansHappyPlace" ]; then
            echo "ERROR: AridmansHappyPlace source directory was not found."
            find "$CM_BUILD_DIR" -maxdepth 4 -type d -print
            exit 1
          fi

          echo "Project files verified successfully."

      - name: Generate Xcode project
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf AridmansHappyPlace.xcodeproj

          xcodegen generate --spec project.yml

          if [ ! -d "AridmansHappyPlace.xcodeproj" ]; then
            echo "ERROR: Xcode project was not generated."
            exit 1
          fi

          echo "Xcode project generated successfully."

      - name: Build unsigned archive
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Find built app
        script: |
          set -e

          ARCHIVE_PATH="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"

          echo "Applications inside archive:"
          find "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 2 \
            -print

          APP_PATH=$(find \
            "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was found in the archive."
            exit 1
          fi

          echo "Built application:"
          echo "$APP_PATH"

          echo "$APP_PATH" > "$CM_BUILD_DIR/app_path.txt"

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH=$(cat "$CM_BUILD_DIR/app_path.txt")

          echo "Packaging:"
          echo "$APP_PATH"

          rm -rf "$CM_BUILD_DIR/unsigned_ipa"

          mkdir -p "$CM_BUILD_DIR/unsigned_ipa/Payload"

          cp -R \
            "$APP_PATH" \
            "$CM_BUILD_DIR/unsigned_ipa/Payload/"

          cd "$CM_BUILD_DIR/unsigned_ipa"

          /usr/bin/zip \
            -qry \
            "$CM_BUILD_DIR/AridmansHappyPlace-unsigned.ipa" \
            Payload

          echo "IPA successfully created:"
          ls -lh "$CM_BUILD_DIR/AridmansHappyPlace-unsigned.ipa"

    artifacts:
      - "AridmansHappyPlace-unsigned.ipa"
      - "build/AridmansHappyPlace.xcarchive"
      - "AridmansHappyPlace.xcodeproj/project.pbxproj"
