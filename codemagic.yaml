
workflows:
  ios_unsigned_ipa:
    name: Aridman's Happy Place - inspect Swift source

    environment:
      xcode: latest

    scripts:

      # ---------------------------------------------------------
      # 1. Extract the actual project from the ZIP
      # ---------------------------------------------------------
      - name: Extract Aridmans Happy Place project
        script: |
          set -e

          ZIP_FILE="Aridmans-Happy-Place-Everything 5.zip"

          echo "Checking for ZIP..."
          test -f "$ZIP_FILE"

          echo "Found:"
          ls -lh "$ZIP_FILE"

          rm -rf extracted
          rm -rf AridmansHappyPlace

          mkdir -p extracted
          mkdir -p AridmansHappyPlace

          echo "Extracting ZIP..."
          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for AridmansHappyPlaceApp.swift..."

          APP_FILE=$(find extracted \
            -type f \
            -name "AridmansHappyPlaceApp.swift" \
            -print \
            -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: AridmansHappyPlaceApp.swift was not found."
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          SOURCE_DIR=$(dirname "$APP_FILE")

          echo "Found source directory:"
          echo "$SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. AridmansHappyPlace/

          echo ""
          echo "===== EXTRACTED PROJECT FILES ====="
          find AridmansHappyPlace -maxdepth 3 -type f -print
          echo "===================================="

          test -f "AridmansHappyPlace/AridmansHappyPlaceApp.swift"
          test -f "AridmansHappyPlace/Videocatalog.swift"

          echo "Project extraction successful."


      # ---------------------------------------------------------
      # 2. Install XcodeGen
      # ---------------------------------------------------------
      - name: Install XcodeGen
        script: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          echo "XcodeGen version:"
          xcodegen --version


      # ---------------------------------------------------------
      # 3. Generate Xcode project
      # ---------------------------------------------------------
      - name: Generate Xcode project
        script: |
          set -e

          rm -rf AridmansHappyPlace.xcodeproj

          echo "Generating Xcode project..."

          xcodegen generate --spec project.yml

          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"

          echo "Xcode project generated successfully."


      # ---------------------------------------------------------
      # 4. Verify project
      # ---------------------------------------------------------
      - name: Verify Xcode project
        script: |
          set -e

          test -d "AridmansHappyPlace.xcodeproj"
          test -f "AridmansHappyPlace.xcodeproj/project.pbxproj"
          test -f "AridmansHappyPlace/AridmansHappyPlaceApp.swift"
          test -f "AridmansHappyPlace/Videocatalog.swift"

          echo ""
          echo "===== XCODE PROJECT ====="

          xcodebuild \
            -project "AridmansHappyPlace.xcodeproj" \
            -list

          echo "=========================="


      # ---------------------------------------------------------
      # 5. INSPECT Videocatalog.swift
      #
      # IMPORTANT:
      # This step DOES NOT change the file.
      # It only prints the suspicious area and raw bytes.
      # ---------------------------------------------------------
      - name: Inspect Videocatalog.swift
        script: |
          set +e

          FILE="AridmansHappyPlace/Videocatalog.swift"

          echo ""
          echo "=============================================="
          echo " VIDEOCATALOG.SWIFT INSPECTION"
          echo "=============================================="

          echo ""
          echo "===== FILE INFORMATION ====="
          ls -lh "$FILE"
          wc -c "$FILE"
          wc -l "$FILE"

          echo ""
          echo "===== LINES 375-395 ====="

          nl -ba "$FILE" | sed -n '375,395p'

          echo ""
          echo "===== RAW BYTES AROUND LINE 389 ====="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("AridmansHappyPlace/Videocatalog.swift")
          data = p.read_bytes()

          lines = data.splitlines(keepends=True)

          print("Total physical lines:", len(lines))
          print()

          start = max(0, 374)
          end = min(len(lines), 395)

          for index in range(start, end):
              line = lines[index]

              print(f"--- RAW LINE {index + 1} ---")
              print(repr(line))

          print()
          print("===== NON-TEXT BYTE CHECK =====")

          bad = []

          for index, byte in enumerate(data):
              # Allow normal ASCII control characters:
              # LF, CR, TAB.
              if byte in (9, 10, 13):
                  continue

              # Normal printable ASCII.
              if 32 <= byte <= 126:
                  continue

              bad.append((index, byte))

          print("Non-printable/non-ASCII byte count:", len(bad))

          if bad:
              print()
              print("First 100 suspicious bytes:")

              for position, byte in bad[:100]:
                  print(f"offset={position} byte={byte}")

          print()
          print("===== UTF-8 CHECK =====")

          try:
              data.decode("utf-8")
              print("UTF-8: VALID")
          except UnicodeDecodeError as e:
              print("UTF-8: INVALID")
              print("Error:", e)

          print()
          print("===== END INSPECTION =====")
          PY

          echo ""
          echo "Inspection complete."

          # Stop here intentionally.
          # We do NOT build until the source has been inspected.
          exit 0


      # ---------------------------------------------------------
      # 6. Build unsigned archive
      #
      # DISABLED during inspection.
      # ---------------------------------------------------------
      # - name: Build unsigned archive
      #   script: |
      #     set -e
      #
      #     rm -rf "$CM_BUILD_DIR/build"
