      #       -configuration Release \
      #       -sdk iphoneos \
      #       -destination "generic/platform=iOS" \
      #       -archivePath "$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive" \
      #       COMPILER_INDEX_STORE_ENABLE=NO \
      #       CODE_SIGNING_ALLOWED=NO \
      #       CODE_SIGNING_REQUIRED=NO \
      #       CODE_SIGN_IDENTITY="" \
      #       DEVELOPMENT_TEAM="" \
      #       archive


      # ---------------------------------------------------------
      # 7. Package unsigned IPA
      #
      # DISABLED during inspection.
      # ---------------------------------------------------------
      # - name: Package unsigned IPA
      #   script: |
      #     set -e
      #
      #     ARCHIVE_PATH="$CM_BUILD_DIR/build/AridmansHappyPlace.xcarchive"
      #
      #     APP_PATH=$(find \
      #       "$ARCHIVE_PATH/Products/Applications" \
      #       -maxdepth 1 \
      #       -type d \
      #       -name "*.app" \
      #       | head -n 1)
      #
      #     test -n "$APP_PATH"
      #
      #     rm -rf "$CM_BUILD_DIR/build/Payload"
      #     mkdir -p "$CM_BUILD_DIR/build/Payload"
      #
      #     cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"
      #
      #     cd "$CM_BUILD_DIR/build"
      #
      #     zip -qr \
      #       "AridmansHappyPlace-unsigned.ipa" \
      #       Payload


    artifacts:
      # No IPA is produced during inspection.
      # We deliberately stop before compilation.
```
