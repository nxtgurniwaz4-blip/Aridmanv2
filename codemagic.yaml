workflows:
  ios_project_diagnostics:
    name: Aridman's Happy Place - Xcode diagnostics

    environment:
      xcode: latest

    scripts:

      # =========================================================
      # 1. Find and extract the main ZIP
      # =========================================================
      - name: Extract main ZIP
        script: |
          set -e

          echo "========================================"
          echo "📦 FINDING PROJECT ZIP"
          echo "========================================"

          rm -rf "$CM_BUILD_DIR/extracted_project"
          mkdir -p "$CM_BUILD_DIR/extracted_project"

          ZIP_FILE=$(find "$CM_BUILD_DIR" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "*/extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found."
            echo ""
            echo "ZIP files:"
            find "$CM_BUILD_DIR" \
              -type f \
              -iname "*.zip" \
              -print
            exit 1
          fi

          echo "✅ ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted_project"

          # Remove macOS archive metadata
          rm -rf "$CM_BUILD_DIR/extracted_project/__MACOSX"

          # Remove Finder metadata
          find "$CM_BUILD_DIR/extracted_project" \
            -name ".DS_Store" \
            -delete

          echo ""
          echo "========================================"
          echo "📂 EXTRACTED CONTENTS"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted_project" \
            -maxdepth 6 \
            -print

      # =========================================================
      # 2. Find the real Xcode project
      # =========================================================
      - name: Find Xcode project
        script: |
          set -e

          echo "========================================"
          echo "🔎 FINDING XCODE PROJECT"
          echo "========================================"

          PROJECT=$(find "$CM_BUILD_DIR/extracted_project" \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/__MACOSX/*" \
            -print \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ No .xcodeproj found."

            echo ""
            echo "Available projects:"
            find "$CM_BUILD_DIR/extracted_project" \
              -type d \
              -name "*.xcodeproj" \
              -print

            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJECT" .xcodeproj)
          PROJECT_DIR=$(dirname "$PROJECT")

          echo "✅ PROJECT:"
          echo "$PROJECT"

          echo ""
          echo "PROJECT NAME:"
          echo "$PROJECT_NAME"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "PROJECT=$PROJECT" > "$CM_BUILD_DIR/project.env"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$CM_BUILD_DIR/project.env"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_BUILD_DIR/project.env"

      # =========================================================
      # 3. Verify project file
      # =========================================================
      - name: Verify project file
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "📄 VERIFYING PROJECT FILE"
          echo "========================================"

          if [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "❌ project.pbxproj not found:"
            echo "$PROJECT/project.pbxproj"
            exit 1
          fi

          echo "✅ project.pbxproj exists"

          echo ""
          echo "Project file size:"
          wc -c "$PROJECT/project.pbxproj"

      # =========================================================
      # 4. List targets and schemes
      # =========================================================
      - name: List Xcode targets and schemes
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "📋 XCODE TARGETS AND SCHEMES"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -list

      # =========================================================
      # 5. Inspect target/platform configuration
      # =========================================================
      - name: Inspect Xcode project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          PBX="$PROJECT/project.pbxproj"

          echo "========================================"
          echo "🔎 PROJECT CONFIGURATION"
          echo "========================================"

          echo ""
          echo "---- PRODUCT TYPES ----"

          grep -nE \
            'productType|productReference' \
            "$PBX" \
            || true

          echo ""
          echo "---- SDK SETTINGS ----"

          grep -nE \
            'SDKROOT|SUPPORTED_PLATFORMS|SUPPORTS_MACCATALYST|TARGETED_DEVICE_FAMILY' \
            "$PBX" \
            || true

          echo ""
          echo "---- PRODUCT SETTINGS ----"

          grep -nE \
            'PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|INFOPLIST_FILE' \
            "$PBX" \
            || true

          echo ""
          echo "---- IOS REFERENCES ----"

          grep -nEi \
            'iphoneos|iphonesimulator|IPHONEOS|ios' \
            "$PBX" \
            || true

          echo ""
          echo "---- MACOS REFERENCES ----"

          grep -nEi \
            'macos|MACOSX|macosx' \
            "$PBX" \
            || true

      # =========================================================
      # 6. Inspect schemes
      # =========================================================
      - name: Inspect schemes
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "📑 SCHEMES"
          echo "========================================"

          echo ""
          echo "All schemes:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.xcscheme" \
            -print

          echo ""
          echo "Shared schemes:"
          find "$PROJECT" \
            -type f \
            -path "*/xcshareddata/xcschemes/*.xcscheme" \
            -print

          echo ""
          echo "Scheme contents:"
          
          for SCHEME in $(find "$PROJECT_DIR" \
            -type f \
            -name "*.xcscheme" \
            -print); do

            echo ""
            echo "----------------------------------------"
            echo "$SCHEME"
            echo "----------------------------------------"

            cat "$SCHEME"
          done

      # =========================================================
      # 7. Inspect Swift sources
      # =========================================================
      - name: Inspect Swift source files
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "🧩 SWIFT SOURCES"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.swift" \
            -not -path "*/__MACOSX/*" \
            -print

      # =========================================================
      # 8. Inspect build settings
      # =========================================================
      - name: Show build settings
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "========================================"
          echo "⚙️ BUILD SETTINGS"
          echo "========================================"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "AridmansHappyPlace" \
            -showBuildSettings \
            2>&1 || true

      # =========================================================
      # 9. Do NOT build yet
      # =========================================================
      - name: Diagnostic complete
        script: |
          echo ""
          echo "========================================"
          echo "✅ DIAGNOSTICS COMPLETE"
          echo "========================================"
          echo ""
          echo "No archive was attempted."
          echo ""
          echo "The Codemagic log above contains:"
          echo "• Xcode targets"
          echo "• schemes"
          echo "• product types"
          echo "• SDK/platform settings"
          echo "• iOS references"
          echo "• macOS references"
          echo "• Swift source files"
          echo ""
          echo "Use this output to repair the project target."
          
    artifacts:
      - extracted_project/**/*.xcodeproj/project.pbxproj
      
